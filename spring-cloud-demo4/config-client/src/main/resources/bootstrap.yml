server:
  port: 7031

# Eureka Client 配置
eureka:
  client:
    service-url:
      defaultZone: http://hzd1:hzd1@localhost:7000/eureka/

spring:
  application:
    name: config-client

cloud:
  config:
    # 配置中心 Config Server 的地址
    uri: http://localhost:7030
    # 读取配置文件(profile)部分，配置文件格式为 application-{profile}.yml
    profile: dev
    # 读取配置文件的项目名
    name: config-client
    fail-fast: true  # 获取不到远程配置时，立即失败